# Netlify reads this file for the Deploy to Netlify button and for every
# deploy after it. Without LIVETENNISAPI_KEY the site shows the sample data.
# To go live, add LIVETENNISAPI_KEY (a FREE key) under Site configuration,
# Environment variables, then trigger a new deploy.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
